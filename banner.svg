<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2631"/>
      <stop offset="100%" stop-color="#2E86C1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E86C1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8E44AD" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="900" height="220"/>
    </clipPath>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <path d="M0,150 C150,190 300,110 450,140 C600,170 750,120 900,150
             C1050,180 1200,100 1350,130 C1500,160 1650,110 1800,150
             L1800,220 L0,220 Z" fill="url(#wave)">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-900 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0,170 C180,140 320,200 480,165 C650,128 780,190 900,160
             C1080,130 1220,192 1380,157 C1550,120 1680,182 1800,160
             L1800,220 L0,220 Z" fill="#0F1720" opacity="0.65">
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="450" y="105" font-family="Fira Code, monospace" font-size="15" fill="#D6EAF8" text-anchor="middle" opacity="0.85">
    &lt;/&gt; crafted with React, Angular, Django &amp; a bit of Three.js magic
  </text>
</svg>
